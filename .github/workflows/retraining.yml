name: Retraining Heart Disease Model

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  retraining:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas scikit-learn==1.5.2

      - name: Run MLflow Project
        working-directory: MLProject
        run: |
          mlflow run . --env-manager local --experiment-name Heart_Disease_Experiment

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: heart-disease-mlflow-artifacts
          path: |
            MLProject/mlruns
            MLProject/mlartifacts
          if-no-files-found: warn